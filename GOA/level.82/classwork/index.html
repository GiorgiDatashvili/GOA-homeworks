<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss"></style>
    <style>
      .container {
        width: 1440px;
      }
    </style>
  </head>
  <body>
    <div class="px-72 pt-45">
      <div class="w-[1440px] h-[660px] bg-violet-500 px-50 pt-28">
        <div class="flex gap-44 w-[1146px]">
          <div class="space-y-6">
            <h1 class="font-[Work_Sans] text-white text-[70px] tracking-tight mt-15">
              Experience the road like never before
            </h1>
            <p class="text-white font-[Work_Sans]">
              Aliquam adipiscing velit semper morbi. Purus non eu cursus
              porttitor tristique et gravida. Quis nunc interdum gravida
              ullamcorper
            </p>
            <button
              class="text-white border-none bg-yellow-500 w-[154px] h-[40px] rounded-[12px] font-[Work_Sans]"
            >
              View all cars
            </button>
          </div>
          <div
            class="flex flex-col w-[420px] h-[503px] bg-white space-y-10 px-10 rounded-[20px]">
            <h1 class="font-[Work_Sans] text-center font-bold text-[28px] mt-5 ">
              Book your car
            </h1>
            <select id="book car" class="w-[336px] h-[28px] font-[Work_Sans]">
              <option value="cartype">Car type</option>
            </select>
            <select id="book car" class="w-[336px] h-[28px] font-[Work_Sans]">
              <option value="placeofrental">Place of rental</option>
            </select>
            <select id="book car" class="w-[336px] h-[28px] font-[Work_Sans]">
              <option value="placeofreturn">Place of return</option>
            </select>
            <div class="flex justify-between font-[Work_Sans]">
              <label for="rental" class="ml-[5px]">Rental date</label>
              <input type="month" id="rental" class="w-[20px]" />
            </div>
            <div class="flex justify-between font-[Work_Sans]">
              <label for="rental" class="ml-[5px]">Return date</label>
              <input type="month" id="rental" class="w-[20px]" />
            </div>
            <button
              class="text-white border-none bg-yellow-500 h-[40px] rounded-[12px] font-[Work_Sans]"
            >
              Book now
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
