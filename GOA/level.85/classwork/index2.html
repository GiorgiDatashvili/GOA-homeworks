<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
 
      let month = prompt(
        "შეიყვანე შენი საყვარელი თვე (იანვარი, აპრილი, ივლისი, სექტემბერი, დეკემბერი)"
      );

      switch (month.toLowerCase()) {
        case "იანვარი":
          alert("იანვარი ზამთარია ");
          break;

        case "აპრილი":
          alert("აპრილი გაზაფხულია ");
          break;

        case "ივლისი":
          alert("ივლისი ზაფხულია ");
          break;

        case "სექტემბერი":
          alert("სექტემბერი შემოდგომაა ");
          break;

        case "დეკემბერი":
          alert("დეკემბერი ზამთარია ");
          break;

        default:
          alert("გთხოვ, აირჩიე მხოლოდ მითითებული თვეებიდან!");
      }
    </script>
  </body>
</html>
